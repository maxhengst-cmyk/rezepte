<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --ground:#12100E; --panel:#1B1714; --panelHi:#241E19; --line:#342C24;
  --bone:#EAE2D6; --ash:#8B7F72; --ashDim:#5E554B;
  --flame:#5B8CF7; --ember:#FF7A1A; --ok:#79C06B; --warn:#E5B33C;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--ground); min-height:100%; }
body {
  font-family:'Barlow', system-ui, -apple-system, sans-serif;
  color:var(--bone); -webkit-font-smoothing:antialiased;
  padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 16px);
}
#wrap { max-width:460px; margin:0 auto; }

.disp { font-family:'Barlow Condensed','Barlow',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.mono { font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
.eyebrow { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ashDim); }

header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }

button {
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.07em;
  font-weight:600; font-size:17px; border:1px solid var(--line); background:var(--panelHi);
  color:var(--bone); border-radius:11px; padding:13px 16px; width:100%; cursor:pointer;
  transition:background 140ms ease; margin-bottom:12px;
}
button:active { background:var(--line); }
button:focus-visible { outline:2px solid var(--flame); outline-offset:2px; }
button.primary { background:var(--flame); border-color:var(--flame); color:#08101F; }
button.hot { background:var(--ember); border-color:var(--ember); color:#1A0A00; }
button.ghost { background:transparent; color:var(--ash); font-size:14px; padding:10px; }
button:disabled { opacity:.35; }

input {
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
  background:var(--ground); border:1px solid var(--line); color:var(--bone);
  border-radius:10px; padding:11px 12px; font-size:17px; width:100%; text-align:center;
}
input:focus { outline:none; border-color:var(--flame); }

.chip {
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.05em;
  font-size:14px; font-weight:600; border:1px solid var(--line); background:transparent;
  color:var(--ash); border-radius:999px; padding:8px 13px; width:auto; margin:0;
}
.chip.on { border-color:var(--flame); color:var(--flame); background:rgba(91,140,247,.10); }

.row { display:flex; gap:10px; margin-bottom:12px; }
.row > * { flex:1; }
.row:last-child { margin-bottom:0; }
.lab { font-size:12px; color:var(--ashDim); letter-spacing:.04em; margin-bottom:5px; display:block; }
.hint { color:var(--ash); font-size:13.5px; line-height:1.55; }

@keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
.live { animation:pulse 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .live { animation:none; opacity:.85; } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <div class="eyebrow">Zwei Zonen, zwei Phasen</div>
      <div class="disp" style="font-size:27px;line-height:1.05;margin-top:2px">Grillplaner</div>
    </div>
    <button class="chip" id="navBtn"></button>
  </header>
  <div id="app"></div>
  <div id="msg" style="color:var(--warn);font-size:13px"></div>
</div>

<script>
/* ------------------------------------------------------------- speicher */
var mem = {};
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
function load(k) {
  try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
  return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
}
function drop(k) { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; }

/* -------------------------------------------------------------- presets */
var PRESETS = [
  { id:'schenkel', label:'Hähnchenschenkel', t1:75, t2:83, amb:175, hint:'Indirekt auf dem Rost, Finish auf der Plancha.' },
  { id:'brust',    label:'Hähnchenbrust',    t1:58, t2:72, amb:160, hint:'Kürzer und vorsichtiger, trocknet schnell aus.' },
  { id:'nacken',   label:'Pulled Pork',      t1:70, t2:92, amb:130, hint:'Lange Strecke, Plateau zwischen 70 und 80 einplanen.' },
  { id:'steak',    label:'Steak rückwärts',  t1:45, t2:54, amb:120, hint:'Ziel medium rare, Finish sehr kurz und sehr heiß.' },
  { id:'lachs',    label:'Lachsfilet',       t1:40, t2:52, amb:140, hint:'Auf der Plancha mit Haut, kaum indirekte Phase nötig.' }
];

/* ---------------------------------------------------------------- utils */
function pad(n) { return String(n).padStart(2,'0'); }
function clock(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function mins(a,b) { return (b-a)/60000; }
function dur(m) { m = Math.max(0, Math.round(m)); return m >= 60 ? Math.floor(m/60)+' h '+pad(m%60)+' min' : m+' min'; }
function num(v) { var n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : null; }
function de(n, d) { return n.toFixed(d === undefined ? 1 : d).replace('.', ','); }
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function heatColor(f) {
  f = Math.max(0, Math.min(1, f));
  var stops = [[0,[126,154,178]],[0.62,[255,122,26]],[1,[255,198,90]]], a = stops[0], b = stops[2];
  for (var i=0;i<2;i++) if (f >= stops[i][0] && f <= stops[i+1][0]) { a = stops[i]; b = stops[i+1]; break; }
  var t = (f - a[0]) / ((b[0]-a[0]) || 1);
  var c = a[1].map(function(v,i){ return Math.round(v + (b[1][i]-v)*t); });
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}

/* Newton'sches Erwärmungsgesetz, k über Regression auf ln(Tu - T) */
function prognose(points, amb, target) {
  var u = points.filter(function(p){ return amb - p.T > 1; });
  if (u.length < 2) return { ok:false, reason:'need2' };
  if (amb - target <= 2) return { ok:false, reason:'ambientLow' };
  var n = u.length, mx = 0, my = 0, i;
  var xs = u.map(function(p){ return p.m; });
  var ys = u.map(function(p){ return Math.log(amb - p.T); });
  for (i=0;i<n;i++) { mx += xs[i]/n; my += ys[i]/n; }
  var nu = 0, de2 = 0;
  for (i=0;i<n;i++) { nu += (xs[i]-mx)*(ys[i]-my); de2 += (xs[i]-mx)*(xs[i]-mx); }
  if (de2 === 0) return { ok:false, reason:'need2' };
  var k = -(nu/de2);
  if (!isFinite(k) || k <= 0.0002) return { ok:false, reason:'flat' };
  var last = u[n-1];
  var dt = Math.log((amb - last.T) / (amb - target)) / k;
  if (!isFinite(dt) || dt < 0) return { ok:false, reason:'flat' };
  return { ok:true, k:k, remaining:dt, lastM:last.m, lastT:last.T, rate:k*(amb-last.T),
           curve:function(m){ return amb - (amb - last.T) * Math.exp(-k*(m - last.m)); } };
}

/* ----------------------------------------------------------- grillplan */
function grillPlan(onRost, count, burnerHot) {
  var glow = burnerHot ? 0.9 : 0.42, s = '', i;
  s += '<svg viewBox="0 0 320 148" width="100%" role="img" aria-label="'
     + (onRost ? 'Fleisch liegt indirekt auf dem Rost' : 'Fleisch liegt auf der Plancha') + '">';
  s += '<defs><radialGradient id="hg" cx="50%" cy="52%" r="62%">'
     + '<stop offset="0%" stop-color="#FF7A1A" stop-opacity="'+glow+'"/>'
     + '<stop offset="55%" stop-color="#C4400F" stop-opacity="'+(glow*0.5)+'"/>'
     + '<stop offset="100%" stop-color="#C4400F" stop-opacity="0"/></radialGradient>'
     + '<linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">'
     + '<stop offset="0%" stop-color="#3A3029"/><stop offset="100%" stop-color="#2A221C"/></linearGradient></defs>';
  s += '<rect x="2" y="2" width="316" height="144" rx="12" fill="#0C0A09" stroke="#342C24"/>';
  s += '<rect x="12" y="14" width="136" height="120" rx="5" fill="url(#pl)" stroke="#342C24"/>';
  s += '<rect x="12" y="14" width="136" height="120" rx="5" fill="url(#hg)"/>';
  [34,58,82,106].forEach(function(y){ s += '<line x1="22" y1="'+y+'" x2="138" y2="'+y+'" stroke="#000" stroke-opacity="0.16"/>'; });
  for (i=0;i<13;i++) s += '<rect x="'+(166+i*11)+'" y="14" width="6" height="120" rx="2" fill="'
     + (onRost ? '#3A312A' : '#2C2520') + '" stroke="#0B0908" stroke-width="0.5"/>';
  for (i=0;i<Math.min(count,10);i++) {
    var col = i%2, row = Math.floor(i/2);
    var x = onRost ? 190+col*52 : 46+col*56, y = 34+row*22;
    s += '<ellipse cx="'+x+'" cy="'+y+'" rx="19" ry="9" fill="#0A0807" opacity="0.5"/>'
       + '<ellipse cx="'+x+'" cy="'+(y-2)+'" rx="19" ry="9" fill="'+(onRost?'#C9A176':'#B4713C')+'" stroke="#6B4A2C" stroke-width="0.8"/>';
  }
  s += '<g class="'+(burnerHot?'live':'')+'"><circle cx="80" cy="140" r="3.4" fill="#5B8CF7"/>'
     + '<text x="90" y="143.5" fill="#5B8CF7" font-size="8" font-family="IBM Plex Mono, monospace">BRENNER AN</text></g>';
  s += '<circle cx="236" cy="140" r="3.4" fill="none" stroke="#5E554B"/>'
     + '<text x="246" y="143.5" fill="#5E554B" font-size="8" font-family="IBM Plex Mono, monospace">AUS</text>';
  s += '<text x="80" y="9" fill="#8B7F72" font-size="8.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" letter-spacing="1.6">PLANCHA</text>';
  s += '<text x="236" y="9" fill="#8B7F72" font-size="8.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" letter-spacing="1.6">ROST</text>';
  return s + '</svg>';
}

/* -------------------------------------------------------------- verlauf */
function verlauf(points, prog, target, startTemp) {
  if (!points.length) return '';
  var W=320,H=128,PL=30,PR=10,PT=10,PB=20;
  var lastM = points[points.length-1].m;
  var endM = Math.max(lastM + (prog.ok ? prog.remaining : 6), lastM + 6);
  var temps = points.map(function(p){ return p.T; });
  var tMin = Math.min.apply(null, [startTemp].concat(temps)) - 4;
  var tMax = Math.max.apply(null, [target].concat(temps)) + 6;
  var px = function(m){ return PL + (m/endM)*(W-PL-PR); };
  var py = function(t){ return PT + (1-(t-tMin)/(tMax-tMin))*(H-PT-PB); };
  var s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Temperaturverlauf">';
  s += '<line x1="'+PL+'" y1="'+py(target)+'" x2="'+(W-PR)+'" y2="'+py(target)+'" stroke="#FF7A1A" stroke-dasharray="2 4" opacity="0.75"/>';
  s += '<text x="'+(PL-5)+'" y="'+(py(target)+3.5)+'" fill="#FF7A1A" font-size="9" text-anchor="end" font-family="IBM Plex Mono, monospace">'+target+'</text>';
  s += '<text x="'+(PL-5)+'" y="'+(py(tMin)+3.5)+'" fill="#5E554B" font-size="9" text-anchor="end" font-family="IBM Plex Mono, monospace">'+Math.round(tMin)+'</text>';
  if (prog.ok) {
    var f = [];
    for (var i=0;i<=26;i++) { var m = prog.lastM + prog.remaining*i/26; f.push(px(m)+','+py(prog.curve(m))); }
    s += '<polyline points="'+f.join(' ')+'" fill="none" stroke="#8B7F72" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.8"/>';
  }
  s += '<polyline points="'+points.map(function(p){ return px(p.m)+','+py(p.T); }).join(' ')
     + '" fill="none" stroke="#5B8CF7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach(function(p){ s += '<circle cx="'+px(p.m)+'" cy="'+py(p.T)+'" r="3" fill="#12100E" stroke="#5B8CF7" stroke-width="1.8"/>'; });
  if (prog.ok) s += '<circle cx="'+px(prog.lastM+prog.remaining)+'" cy="'+py(target)+'" r="3.6" fill="#FF7A1A"/>';
  s += '<text x="'+(W-PR)+'" y="'+(H-5)+'" fill="#5E554B" font-size="9" text-anchor="end" font-family="IBM Plex Mono, monospace">'+Math.round(endM)+' min</text>';
  s += '<text x="'+PL+'" y="'+(H-5)+'" fill="#5E554B" font-size="9" font-family="IBM Plex Mono, monospace">0</text>';
  return s + '</svg>';
}

/* -------------------------------------------------------------- zustand */
var S = { view:'setup', session:null, log:[], tempIn:'',
          preset:PRESETS[0], count:8, t1:75, t2:83, amb:175 };

(function boot() {
  var l = load('grill:log');   if (l) { try { S.log = JSON.parse(l) || []; } catch (e) {} }
  var s = load('grill:session'); if (s) { try { var o = JSON.parse(s); if (o) { S.session = o; S.view = 'run'; } } catch (e) {} }
})();

function saveSession() { S.session ? store('grill:session', JSON.stringify(S.session)) : drop('grill:session'); }
function saveLog() { store('grill:log', JSON.stringify(S.log)); }
function msg(t) { document.getElementById('msg').textContent = t || ''; }

/* -------------------------------------------------------------- rendern */
var app = document.getElementById('app');
var navBtn = document.getElementById('navBtn');

navBtn.addEventListener('click', function() {
  S.view = (S.view === 'log') ? (S.session ? 'run' : 'setup') : 'log';
  render();
});

function render() {
  navBtn.textContent = S.view === 'log' ? 'Zurück' : ('Protokoll ' + (S.log.length || ''));
  if (S.view === 'log') return renderLog();
  if (!S.session) return renderSetup();
  return renderRun();
}

/* --- Protokoll --- */
function renderLog() {
  if (!S.log.length) {
    app.innerHTML = '<div class="card"><div class="disp" style="font-size:18px;margin-bottom:6px">Noch keine Durchgänge</div>'
      + '<div class="hint">Beende einen Durchgang, dann steht er hier mit Zeiten und Temperaturen. '
      + 'Beim nächsten Mal hast du Erfahrungswerte statt Schätzungen.</div></div>';
    return;
  }
  app.innerHTML = S.log.map(function(e) {
    return '<div class="card" style="padding:14px">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline">'
      + '<div class="disp" style="font-size:18px">'+esc(e.name)+'</div>'
      + '<div class="mono" style="font-size:12px;color:var(--ashDim)">'+esc(e.date)+'</div></div>'
      + '<div class="mono" style="font-size:13px;color:var(--ash);margin-top:8px;line-height:1.7">'
      + e.count+' Stück · Garraum '+e.amb+' °C<br>'
      + 'Phase 1 '+dur(e.p1)+' bis '+e.t1+' °C'+(e.startT!==null&&e.startT!==undefined ? ' (Start '+de(e.startT)+' °C)' : '')+'<br>'
      + 'Phase 2 '+dur(e.p2)+(e.finalT ? ' · fertig bei '+de(e.finalT)+' °C' : '')
      + '</div></div>';
  }).join('') + '<button class="ghost" id="clr">Protokoll leeren</button>';
  document.getElementById('clr').addEventListener('click', function() {
    S.log = []; saveLog(); render();
  });
}

/* --- Setup --- */
function renderSetup() {
  app.innerHTML =
    '<div class="card"><div class="eyebrow" style="margin-bottom:10px">Was liegt auf</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px">'
    + PRESETS.map(function(p){ return '<button class="chip'+(S.preset.id===p.id?' on':'')+'" data-p="'+p.id+'">'+esc(p.label)+'</button>'; }).join('')
    + '</div><div class="hint" style="margin-top:12px">'+esc(S.preset.hint)+'</div></div>'

    + '<div class="card"><div class="eyebrow" style="margin-bottom:12px">Eckwerte</div>'
    + '<div class="row"><div><label class="lab">Stück</label><input id="f-count" inputmode="numeric" value="'+S.count+'"></div>'
    + '<div><label class="lab">Garraum °C</label><input id="f-amb" inputmode="numeric" value="'+S.amb+'"></div></div>'
    + '<div class="row"><div><label class="lab">Ziel Phase 1</label><input id="f-t1" inputmode="decimal" value="'+S.t1+'"></div>'
    + '<div><label class="lab">Ziel Phase 2</label><input id="f-t2" inputmode="decimal" value="'+S.t2+'"></div></div></div>'

    + '<button class="primary" id="go">Durchgang starten</button>';

  Array.prototype.forEach.call(app.querySelectorAll('[data-p]'), function(b) {
    b.addEventListener('click', function() {
      var p = PRESETS.filter(function(x){ return x.id === b.getAttribute('data-p'); })[0];
      S.preset = p; S.t1 = p.t1; S.t2 = p.t2; S.amb = p.amb; render();
    });
  });
  ['count','amb','t1','t2'].forEach(function(f) {
    document.getElementById('f-'+f).addEventListener('input', function(e) {
      var v = num(e.target.value); if (v !== null) S[f] = f === 'count' ? Math.max(1, Math.round(v)) : v;
    });
  });
  document.getElementById('go').addEventListener('click', function() {
    S.session = { name:S.preset.label, count:S.count, t1:S.t1, t2:S.t2, amb:S.amb,
                  phase:1, startedAt:Date.now(), phase2At:null, points:[] };
    S.tempIn = ''; S.view = 'run'; saveSession(); render();
  });
}

/* --- Laufender Durchgang --- */
function renderRun() {
  var s = S.session, p1 = s.phase === 1;
  var target = p1 ? s.t1 : s.t2;
  var prog = p1 ? prognose(s.points, s.amb, s.t1) : { ok:false, reason:'phase2' };
  var lastT = s.points.length ? s.points[s.points.length-1].T : null;
  var startT = s.points.length ? s.points[0].T : target - 50;
  var frac = lastT !== null ? (lastT - startT) / ((target - startT) || 1) : 0;
  var reached = lastT !== null && lastT >= s.t1;

  var html = '<div class="card" style="padding:10px">' + grillPlan(p1, s.count, !p1) + '</div>';

  html += '<div class="card">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline">'
    + '<div class="eyebrow">' + (p1 ? 'Phase 1 · indirekt' : 'Phase 2 · Plancha') + '</div>'
    + '<div class="mono" style="font-size:12px;color:var(--ashDim)">seit <span id="elapsed"></span></div></div>'
    + '<div style="display:flex;align-items:flex-end;gap:14px;margin-top:8px">'
    + '<div class="mono" style="font-size:46px;line-height:1;color:'+(lastT===null?'var(--ashDim)':heatColor(frac))+'">'
    + (lastT===null ? '--' : de(lastT)) + '</div>'
    + '<div style="padding-bottom:6px"><div class="mono" style="font-size:13px;color:var(--ash)">Ziel '+target+' °C</div>'
    + (prog.ok ? '<div class="mono" style="font-size:13px;color:var(--ashDim)">+'+de(prog.rate)+' °C/min</div>' : '')
    + '</div></div>';

  if (p1) {
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">';
    if (prog.ok) {
      html += '<div class="disp" style="font-size:22px;color:var(--ember)">noch <span id="remain"></span></div>'
        + '<div class="mono" style="font-size:13px;color:var(--ash);margin-top:3px">'+s.t1+' °C gegen <span id="eta"></span> Uhr</div>';
    } else {
      var t = prog.reason === 'need2' ? 'Trag zwei Messungen im Abstand von ein paar Minuten ein, dann rechne ich die Restzeit hoch.'
        : prog.reason === 'ambientLow' ? 'Der Garraum liegt mit '+s.amb+' °C zu nah am Ziel. Brenner höher, sonst wird das nichts.'
        : 'Die Kurve steigt gerade nicht. Deckel zu und Garraumtemperatur prüfen.';
      html += '<div class="hint">'+t+'</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  if (p1 && s.points.length) {
    html += '<div class="card" style="padding-bottom:8px"><div class="eyebrow" style="margin-bottom:6px">Verlauf</div>'
      + verlauf(s.points, prog, s.t1, startT) + '</div>';
  }

  html += '<div class="card"><div class="eyebrow" style="margin-bottom:10px">'
    + (p1 ? 'Kerntemperatur eintragen' : 'Endtemperatur eintragen') + '</div>'
    + '<div class="row"><input id="tin" inputmode="decimal" placeholder="°C" value="'+esc(S.tempIn)+'">'
    + (p1 ? '<button id="add" style="margin:0">Übernehmen</button>'
          : '<button class="hot" id="fin" style="margin:0">Fertig</button>') + '</div>';
  if (p1 && s.points.length) {
    html += '<div class="mono" style="font-size:12px;color:var(--ashDim);margin-top:10px;line-height:1.7">'
      + s.points.slice(-4).map(function(p){ return clock(p.at)+' · '+de(p.T)+' °C · Minute '+Math.round(p.m); }).join('<br>')
      + '</div>';
  }
  html += '</div>';

  html += p1
    ? '<button class="'+(reached?'hot':'')+'" id="next">'+(reached?'Ziel erreicht, ab auf die Plancha':'Weiter zu Phase 2')+'</button>'
    : '<button class="ghost" id="back">Zurück in Phase 1</button>';

  if (!p1) {
    html += '<div class="card"><div class="eyebrow" style="margin-bottom:8px">Jetzt gilt</div>'
      + '<div class="hint">Hautseite nach unten, Deckel offen, nicht bewegen bis sie sich von selbst löst. '
      + 'Lackieren erst in der letzten Minute. Bei '+s.t2+' °C runter und fünf Minuten ruhen lassen.</div></div>';
  }
  html += '<button class="ghost" id="abort">Durchgang verwerfen</button>';

  app.innerHTML = html;

  var tin = document.getElementById('tin');
  tin.addEventListener('input', function(e){ S.tempIn = e.target.value; });
  tin.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); commit(); } });

  function commit() {
    var T = num(S.tempIn); if (T === null) return;
    if (S.session.phase === 1) {
      S.session.points.push({ m: mins(S.session.startedAt, Date.now()), T: T, at: Date.now() });
      S.tempIn = ''; saveSession(); render();
    } else { finish(T); }
  }
  var addB = document.getElementById('add'); if (addB) addB.addEventListener('click', commit);
  var finB = document.getElementById('fin'); if (finB) finB.addEventListener('click', commit);

  var nx = document.getElementById('next');
  if (nx) nx.addEventListener('click', function() {
    S.session.phase = 2; S.session.phase2At = Date.now(); S.tempIn = ''; saveSession(); render();
  });
  var bk = document.getElementById('back');
  if (bk) bk.addEventListener('click', function() {
    S.session.phase = 1; S.session.phase2At = null; saveSession(); render();
  });
  document.getElementById('abort').addEventListener('click', function() {
    S.session = null; S.tempIn = ''; saveSession(); S.view = 'setup'; render();
  });

  tick();
}

function finish(T) {
  var s = S.session, now = Date.now();
  S.log.unshift({
    id: now, name: s.name, count: s.count, amb: s.amb, t1: s.t1, t2: s.t2,
    date: new Date().toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' }),
    p1: s.phase2At ? mins(s.startedAt, s.phase2At) : mins(s.startedAt, now),
    p2: s.phase2At ? mins(s.phase2At, now) : 0,
    finalT: T, startT: s.points.length ? s.points[0].T : null
  });
  S.log = S.log.slice(0, 40); saveLog();
  S.session = null; S.tempIn = ''; saveSession(); S.view = 'log'; render();
}

/* ----------------------------------------------------------------- tick */
function tick() {
  if (!S.session || S.view !== 'run') return;
  var s = S.session, p1 = s.phase === 1, now = Date.now();
  var el = document.getElementById('elapsed');
  if (el) el.textContent = dur(mins(p1 ? s.startedAt : s.phase2At, now));
  var prog = p1 ? prognose(s.points, s.amb, s.t1) : { ok:false };
  if (prog.ok) {
    var elapsedSince = mins(s.points[s.points.length-1].at, now);
    var rest = Math.max(0, prog.remaining - elapsedSince);
    var r = document.getElementById('remain'); if (r) r.textContent = dur(rest);
    var e = document.getElementById('eta'); if (e) e.textContent = clock(now + rest*60000);
  }
}
setInterval(tick, 1000);

render();
</script>
</body>
</html>
