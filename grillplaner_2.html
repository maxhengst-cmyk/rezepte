<style>
:root {
  --ground:#12100E; --panel:#1B1714; --panelHi:#241E19; --line:#342C24;
  --bone:#EAE2D6; --ash:#8B7F72; --ashDim:#5E554B;
  --flame:#5B8CF7; --ember:#FF7A1A; --ok:#79C06B;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--ground); min-height:100%; }
body {
  font-family:'Barlow', -apple-system, system-ui, sans-serif;
  color:var(--bone); -webkit-font-smoothing:antialiased;
  padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 16px);
}
#wrap { max-width:460px; margin:0 auto; }
.disp { font-family:'Barlow Condensed','Barlow',-apple-system,sans-serif; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.mono { font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums; }
.eyebrow { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ashDim); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
button {
  font-family:'Barlow Condensed',-apple-system,sans-serif; text-transform:uppercase; letter-spacing:.07em;
  font-weight:600; font-size:17px; border:1px solid var(--line); background:var(--panelHi);
  color:var(--bone); border-radius:11px; padding:14px 16px; width:100%; cursor:pointer; margin-bottom:10px;
}
button:active { background:var(--line); }
button.primary { background:var(--flame); border-color:var(--flame); color:#08101F; }
button.hot { background:var(--ember); border-color:var(--ember); color:#1A0A00; }
button.ghost { background:transparent; color:var(--ash); font-size:14px; padding:10px; margin-bottom:0; }
.specs { display:flex; gap:8px; margin-bottom:12px; }
.spec { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:9px 4px 8px; text-align:center; }
.spec b { display:block; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:15px; font-weight:600; color:var(--bone); margin-top:3px; }
.spec span { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ashDim); }
.steptext { font-size:16.5px; line-height:1.6; color:var(--bone); }
.steptext em { color:var(--ember); font-style:normal; font-weight:600; }
.timerbox { text-align:center; padding:14px 0 4px; }
.timerbox .t { font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:52px; line-height:1; }
.timerbox .l { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ashDim); margin-top:6px; }
.trow { display:flex; gap:10px; margin-top:14px; }
.trow button { margin:0; flex:1; }
.list { margin-top:4px; }
.li { display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
.li:last-child { border-bottom:none; }
.li .n {
  width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px; border:1px solid var(--line); color:var(--ashDim);
}
.li.done .n { border-color:var(--ok); color:var(--ok); }
.li.cur .n { border-color:var(--ember); color:var(--ember); }
.li .tt { font-size:15px; color:var(--ash); }
.li.cur .tt { color:var(--bone); font-weight:600; }
.li.done .tt { color:var(--ashDim); text-decoration:line-through; }
.li .tm { margin-left:auto; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--ashDim); flex:none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.alarm { animation:blink 1s ease-in-out infinite; color:var(--ember) !important; }
@media (prefers-reduced-motion: reduce) { .alarm { animation:none; } }
</style>
</head>
<body>
<div id="wrap">
  <header style="margin-bottom:14px">
    <div class="eyebrow">Weber · Plancha links, Rost rechts</div>
    <div class="disp" style="font-size:26px;line-height:1.1;margin-top:2px">Marinierte Hähnchenschenkel</div>
  </header>

  <div class="specs">
    <div class="spec"><span>Deckel</span><b>170–180°</b></div>
    <div class="spec"><span>Meater</span><b>75°</b></div>
    <div class="spec"><span>Platte</span><b>180–200°</b></div>
    <div class="spec"><span>Fertig</span><b>80–85°</b></div>
  </div>

  <div class="card" style="padding:10px" id="plan"></div>
  <div id="main"></div>
  <div class="card list" id="list"></div>
  <button class="ghost" id="reset">Von vorn beginnen</button>
</div>

<script>
/* ---------------------------------------------------------------- daten */
var STEPS = [
  { t:'Fleisch rausholen', sec:1800, tl:'Temperieren',
    x:'Schenkel aus dem Kühlschrank. Überschüssige Marinade abstreifen, Haut <em>trocken tupfen</em>. Nasse Haut wird nie knusprig. Meater und Einstichthermometer bereitlegen.',
    meat:'none', burner:'aus' },
  { t:'Grill vorheizen', sec:600, tl:'Vorheizen',
    x:'<em>Linken Brenner an</em> (unter der Plancha), mittlere Stufe. Rechten Brenner aus lassen. Deckel zu. Ziel: <em>170 bis 180 °C</em> am Deckelthermometer, nicht an der Platte gemessen.',
    meat:'none', burner:'an' },
  { t:'Plancha und Meater vorbereiten', sec:0,
    x:'Heiße Platte mit dem Spachtel abziehen und mit einem geölten Küchentuch dünn auswischen. Meater <em>längs in den dicksten Schenkel</em>, parallel zum Knochen, Keramikring bleibt komplett draußen. Meater-Ziel: <em>75 °C</em>.',
    meat:'none', burner:'an' },
  { t:'Auflegen, indirekt', sec:900, tl:'Bis Positionstausch',
    x:'Schenkel auf den <em>Rost rechts</em>, Hautseite nach oben, über den kalten Brenner. Deckel zu und zu lassen, jedes Öffnen kostet Zeit. Nicht wenden.',
    meat:'rost', burner:'an' },
  { t:'Positionen tauschen', sec:0,
    x:'Kurz Deckel auf: Stücke nahe der Plancha nach außen, äußere nach innen. Die Seite an der Platte bekommt mehr Strahlungswärme. Haut bleibt oben. Deckel wieder zu.',
    meat:'rost', burner:'an' },
  { t:'Auf 75 °C warten', sec:0,
    x:'Jetzt entscheidet der Meater, nicht die Uhr. Sobald er <em>ca. 70 °C</em> zeigt: linken Brenner <em>hochdrehen</em>, damit die Platte beim Alarm 180 bis 200 °C hat. Test: Wassertropfen muss perlen und tanzen.',
    meat:'rost', burner:'hoch' },
  { t:'Finish auf der Plancha', sec:240, tl:'Knusprig braten',
    x:'<em>Meater raus</em>, nicht auf die heiße Platte legen. Alle Schenkel <em>Hautseite nach unten</em> auf die Plancha, Deckel offen. Nicht bewegen, bis sich die Haut von selbst löst. Lackieren erst in der letzten Minute.',
    meat:'plancha', burner:'hoch' },
  { t:'Endkontrolle', sec:0,
    x:'Einstichthermometer am dicksten Punkt, <em>nicht am Knochen</em>: 80 bis 85 °C. Noch nicht da? Ein bis zwei Minuten weiter, dann erneut messen.',
    meat:'plancha', burner:'hoch' },
  { t:'Ruhen lassen', sec:300, tl:'Ruhen',
    x:'Locker unter Alufolie, linken Brenner runterdrehen. Nebenbei die noch warme Platte: <em>Schuss Wasser drauf, abziehen</em>, in 30 Sekunden sauber.',
    meat:'none', burner:'aus' }
];

/* ------------------------------------------------------------- speicher */
var mem = {};
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
function loadv(k){ try{ var v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return mem[k]!==undefined?mem[k]:null; }

var S = { step:0, endAt:null, paused:null, alarm:false };
(function(){ var s=loadv('gflow'); if(s){ try{ var o=JSON.parse(s); if(o && o.step>=0 && o.step<=STEPS.length) S=o; }catch(e){} } })();
function save(){ store('gflow', JSON.stringify(S)); }

/* ----------------------------------------------------------------- ton */
var actx = null;
function beep() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    for (var i=0;i<3;i++) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime + i*0.5);
      g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + i*0.5 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i*0.5 + 0.35);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + i*0.5); o.stop(actx.currentTime + i*0.5 + 0.4);
    }
  } catch(e){}
}

/* ------------------------------------------------------------ grillplan */
function plan(meat, burner) {
  var hot = burner !== 'aus', high = burner === 'hoch';
  var glow = high ? 0.95 : (hot ? 0.55 : 0.12);
  var s = '<svg viewBox="0 0 320 132" width="100%">';
  s += '<defs><radialGradient id="hg" cx="50%" cy="52%" r="62%">'
    + '<stop offset="0%" stop-color="#FF7A1A" stop-opacity="'+glow+'"/>'
    + '<stop offset="55%" stop-color="#C4400F" stop-opacity="'+(glow*0.5)+'"/>'
    + '<stop offset="100%" stop-color="#C4400F" stop-opacity="0"/></radialGradient></defs>';
  s += '<rect x="2" y="2" width="316" height="128" rx="12" fill="#0C0A09" stroke="#342C24"/>';
  s += '<rect x="12" y="14" width="136" height="102" rx="5" fill="#2E2620" stroke="#342C24"/>';
  s += '<rect x="12" y="14" width="136" height="102" rx="5" fill="url(#hg)"/>';
  for (var i=0;i<13;i++) s += '<rect x="'+(166+i*11)+'" y="14" width="6" height="102" rx="2" fill="#39302A" stroke="#0B0908" stroke-width="0.5"/>';
  if (meat !== 'none') {
    for (var j=0;j<8;j++) {
      var col=j%2, row=Math.floor(j/2);
      var x = meat==='rost' ? 190+col*52 : 46+col*56, y = 30+row*20;
      s += '<ellipse cx="'+x+'" cy="'+y+'" rx="18" ry="8" fill="'+(meat==='rost'?'#C9A176':'#B4713C')+'" stroke="#6B4A2C" stroke-width="0.8"/>';
    }
  }
  var lbl = burner==='aus' ? 'BRENNER AUS' : (high ? 'BRENNER HOCH' : 'BRENNER MITTEL');
  var lc  = burner==='aus' ? '#5E554B' : (high ? '#FF7A1A' : '#5B8CF7');
  s += '<circle cx="66" cy="124" r="3.4" fill="'+lc+'"/><text x="76" y="127.5" fill="'+lc+'" font-size="8" font-family="ui-monospace,monospace">'+lbl+'</text>';
  s += '<circle cx="230" cy="124" r="3.4" fill="none" stroke="#5E554B"/><text x="240" y="127.5" fill="#5E554B" font-size="8" font-family="ui-monospace,monospace">AUS</text>';
  s += '<text x="80" y="10" fill="#8B7F72" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace" letter-spacing="1.6">PLANCHA</text>';
  s += '<text x="236" y="10" fill="#8B7F72" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace" letter-spacing="1.6">ROST</text>';
  return s + '</svg>';
}

/* --------------------------------------------------------------- render */
function fmt(sec){ sec=Math.max(0,Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function tleft(){
  if (S.paused !== null) return S.paused;
  if (S.endAt !== null) return (S.endAt - Date.now())/1000;
  return null;
}

function render() {
  var done = S.step >= STEPS.length;
  var st = done ? STEPS[STEPS.length-1] : STEPS[S.step];
  document.getElementById('plan').innerHTML = plan(done?'none':st.meat, done?'aus':st.burner);

  var m = document.getElementById('main'), h = '';
  if (done) {
    h = '<div class="card"><div class="eyebrow" style="margin-bottom:8px">Geschafft</div>'
      + '<div class="steptext">Fünf Minuten sind um: anrichten und servieren. <em>Guten Appetit.</em></div></div>';
  } else {
    h = '<div class="card">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'
      + '<div class="eyebrow">Schritt '+(S.step+1)+' von '+STEPS.length+'</div></div>'
      + '<div class="disp" style="font-size:22px;margin-bottom:10px">'+st.t+'</div>'
      + '<div class="steptext">'+st.x+'</div>';
    if (st.sec > 0) {
      var left = tleft();
      h += '<div class="timerbox"><div class="t'+(S.alarm?' alarm':'')+'" id="tt">'
        + (S.alarm ? 'ZEIT UM' : fmt(left===null?st.sec:left)) + '</div>'
        + '<div class="l">'+st.tl+'</div></div>'
        + '<div class="trow">'
        + (S.endAt===null && S.paused===null && !S.alarm
            ? '<button class="hot" id="tstart" style="margin:0">Timer starten</button>'
            : (S.alarm
                ? '<button id="treset" style="margin:0">Timer zurücksetzen</button>'
                : (S.paused!==null
                    ? '<button id="tgo" style="margin:0">Weiter</button><button class="ghost" id="treset" style="margin:0">Reset</button>'
                    : '<button id="tpause" style="margin:0">Pause</button><button class="ghost" id="treset" style="margin:0">Reset</button>')))
        + '</div>';
    }
    h += '</div>'
      + '<button class="primary" id="next">'+(S.step===STEPS.length-1?'Fertig':'Weiter')+'</button>'
      + (S.step>0 ? '<button class="ghost" id="prev">Schritt zurück</button>' : '');
  }
  m.innerHTML = h;

  var q = function(id){ return document.getElementById(id); };
  if (q('next')) q('next').addEventListener('click', function(){ go(S.step+1); });
  if (q('prev')) q('prev').addEventListener('click', function(){ go(S.step-1); });
  if (q('tstart')) q('tstart').addEventListener('click', function(){
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    S.endAt = Date.now() + st.sec*1000; S.paused = null; S.alarm = false; save(); render();
  });
  if (q('tpause')) q('tpause').addEventListener('click', function(){ S.paused = tleft(); S.endAt = null; save(); render(); });
  if (q('tgo')) q('tgo').addEventListener('click', function(){ S.endAt = Date.now() + S.paused*1000; S.paused = null; save(); render(); });
  if (q('treset')) q('treset').addEventListener('click', function(){ S.endAt = null; S.paused = null; S.alarm = false; save(); render(); });

  var lst = document.getElementById('list'), lh = '';
  STEPS.forEach(function(sp, i) {
    var cls = i < S.step ? 'done' : (i === S.step && !done ? 'cur' : '');
    lh += '<div class="li '+cls+'" data-i="'+i+'"><div class="n">'+(i<S.step?'✓':(i+1))+'</div>'
        + '<div class="tt">'+sp.t+'</div>'
        + (sp.sec>0 ? '<div class="tm">'+Math.round(sp.sec/60)+' min</div>' : '') + '</div>';
  });
  lst.innerHTML = lh;
  Array.prototype.forEach.call(lst.querySelectorAll('.li'), function(el){
    el.addEventListener('click', function(){ go(parseInt(el.getAttribute('data-i'),10)); });
  });
}

function go(i) {
  S.step = Math.max(0, Math.min(STEPS.length, i));
  S.endAt = null; S.paused = null; S.alarm = false;
  save(); render();
  window.scrollTo(0, 0);
}

document.getElementById('reset').addEventListener('click', function(){ go(0); });

setInterval(function() {
  if (S.endAt === null || S.alarm) return;
  var left = tleft();
  if (left <= 0) { S.alarm = true; S.endAt = null; save(); beep(); render(); return; }
  var el = document.getElementById('tt');
  if (el) el.textContent = fmt(left);
}, 250);

render();
</script>
</body>
</html>
